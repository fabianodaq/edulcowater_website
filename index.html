<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EdulcoWater | Home</title>
    <link rel="icon" type="image/svg+xml" href="assets/logoedulcowater.svg">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-base-path="." data-page="home">

    <header class="main-header">
        <div class="container">
            <nav class="main-nav">
                <div class="brand" aria-label="Edulco Water"><img src="assets/logoedulcowater.svg" alt=""><span>EdulcoWater</span></div>
                <div class="header-actions">
                    <div class="language-switcher">
                        <button class="language-button" type="button" aria-expanded="false" aria-controls="language-menu" aria-label="Select language">English <span aria-hidden="true">⌄</span></button>
                        <div class="language-menu" id="language-menu">
                            <button class="language-option active" type="button" data-language="EN">English</button>
                            <button class="language-option" type="button" data-language="IT">Italiano</button>
                            <button class="language-option" type="button" data-language="ESP">Español</button>
                            <button class="language-option" type="button" data-language="DE">Deutsch</button>
                            <button class="language-option" type="button" data-language="FR">Français</button>
                        </div>
                    </div>
                    <a class="icon-button cart-button" href="cart/index.html" aria-label="Cart" title="Cart">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 11h10l2-8H6"></path><circle cx="9" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg>
                        <span class="cart-count">0</span>
                    </a>
                </div>
            </nav>
        </div>
        <nav class="menu-panel" id="site-menu" aria-label="Main navigation">
            <div class="container" data-menu-panel></div>
        </nav>
    </header>


    <main>
        <section class="solutions-section">
            <div class="container">
                <h1 class="solutions-title">Water Quality System<br><small><em>"...because every balance needs a solution"</em></small></h1>

                <section class="intro-video" aria-label="Edulco Water introduction">
                    <video class="intro-video-media" autoplay loop muted playsinline poster="assets/logo.jpg">
                        <source src="assets/edulcowater-intro.mp4" type="video/mp4">
                    </video>
                    <div class="intro-video-overlay">
                        <span class="fish-reel-label">EDULCO WATER · INTRODUCTION</span>
                        <p>Water becoming<br><strong>care.</strong></p>
                        <button class="audio-toggle" type="button" aria-label="Turn audio on" aria-pressed="false">
                            <span class="audio-toggle-icon" aria-hidden="true">🔇</span>
                            <span class="audio-toggle-label">Audio off</span>
                        </button>
                    </div>
                </section>

                <h2 class="build-system-title">Build Your System</h2>
                <div class="solutions-grid">
                    <a class="solution-card solution-pool" href="bypool/index.html" aria-label="Build your swimming pool system">
                        <img class="solution-image" src="assets/bypool/bypool.jpeg" alt="Swimming pool water system">
                        <span class="solution-link">Swimming Pools ↗</span>
                    </a>
                    <a class="solution-card solution-hydroponics" href="byhydro/index.html" aria-label="Build your hydroponics system">
                        <img class="solution-image" src="assets/byhydro/byhydro.jpeg" alt="Hydroponics water system">
                        <span class="solution-link">Hydroponics ↗</span>
                    </a>
                    <a class="solution-card solution-aquarium" href="byaquarium/index.html" aria-label="Build your aquarium system">
                        <img class="solution-image" src="assets/byaquarium/byaquarium.jpeg" alt="Aquarium water system">
                        <span class="solution-link">Aquariums ↗</span>
                    </a>
                    <a class="solution-card solution-solar" href="bysolar/index.html" aria-label="Build your solar system">
                        <img class="solution-image" src="assets/bysolar/bysolar.jpeg" alt="Solar water system">
                        <span class="solution-link">Solar ↗</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
