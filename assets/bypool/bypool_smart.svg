<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Impianto piscina configurabile</title>
  <desc id="desc">Schema SVG modulare con centralina pH/ORP/temperatura, dosaggio, vasca, sonde, pompa, filtro e riscaldatore.</desc>

  <style>
.label{font:600 16px Arial,sans-serif;fill:#243443}
    .small{font:13px Arial,sans-serif;fill:#6c7b88}
    .tiny{font:11px Arial,sans-serif;fill:#6c7b88}
    .component{cursor:pointer}
    .component:hover .hit,.component.is-selected .hit{stroke:#157bb8;stroke-width:4}
    .hit{fill:transparent;stroke:transparent;stroke-width:8}
    .pipe{fill:none;stroke:#59798f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .signal{fill:none;stroke:#9aa7b2;stroke-width:2;stroke-dasharray:6 5}
    .device{fill:white;stroke:#526778;stroke-width:2}
    .soft{fill:#f5f7f9;stroke:#9aabb7;stroke-width:2}
    .hidden-option{display:none}
  </style>

  <!-- BACKGROUND / TITLE -->
  <g id="background">
    <rect width="1200" height="720" fill="#ffffff"/>
    <text x="600" y="42" text-anchor="middle" class="label" style="font-size:24px">CONTROLLO QUALITÀ ACQUA PISCINA</text>
    <text x="600" y="65" text-anchor="middle" class="small">pH • ORP (Redox) • Temperatura</text>
  </g>

  <!-- CENTRALINA -->
  <g id="control_unit" class="component" data-component="Centralina di controllo">
    <rect class="hit" x="425" y="82" width="350" height="150" rx="10"/>
    <rect class="soft" x="450" y="100" width="300" height="115" rx="8"/>
    <rect x="535" y="123" width="125" height="52" rx="4" fill="#1d252b"/>
    <text x="598" y="157" text-anchor="middle" fill="#eaf7ff" style="font:700 28px monospace">7.40</text>
    <rect x="474" y="125" width="34" height="18" rx="3" class="device"/>
    <rect x="474" y="154" width="34" height="18" rx="3" class="device"/>
    <rect x="690" y="125" width="34" height="18" rx="3" class="device"/>
    <rect x="690" y="154" width="34" height="18" rx="3" class="device"/>
    <text x="600" y="195" text-anchor="middle" class="small">Controller</text>
  </g>

  <!-- LINEE SEGNALE -->
  <g id="signal_lines">
    <path class="signal" d="M485 215 V280 H115 V345"/>
    <path class="signal" d="M535 215 V260 H240 V345"/>
    <path class="signal" d="M620 215 V300 H790 V345"/>
    <path class="signal" d="M670 215 V285 H855 V345"/>
    <path class="signal" d="M715 215 V270 H925 V345"/>
  </g>

  <!-- DOSAGGIO pH -->
  <g id="dosing_ph" class="component" data-component="Dosaggio pH">
    <rect class="hit" x="45" y="265" width="145" height="340" rx="10"/>
    <text x="110" y="286" text-anchor="middle" class="small">Pompa dosatrice pH</text>
    <rect x="82" y="305" width="56" height="58" rx="8" fill="#1477d4" stroke="#24516f" stroke-width="2"/>
    <circle cx="110" cy="334" r="13" fill="#fff"/>
    <path d="M110 363 V438" stroke="#1477d4" stroke-width="4"/>
    <path d="M74 455 h72 l-8 132 H82z" fill="#eef7ff" stroke="#7aa3bf" stroke-width="2"/>
    <text x="110" y="515" text-anchor="middle" class="small">pH−</text>
    <text x="110" y="536" text-anchor="middle" class="tiny">correttore</text>
  </g>

  <!-- DOSAGGIO REDOX -->
  <g id="dosing_orp" class="component" data-component="Dosaggio Redox / Cloro">
    <rect class="hit" x="175" y="265" width="150" height="340" rx="10"/>
    <text x="250" y="286" text-anchor="middle" class="small">Pompa dosatrice Redox</text>
    <rect x="222" y="305" width="56" height="58" rx="8" fill="#e94b4b" stroke="#7b3333" stroke-width="2"/>
    <circle cx="250" cy="334" r="13" fill="#fff"/>
    <path d="M250 363 V438" stroke="#e94b4b" stroke-width="4"/>
    <path d="M214 455 h72 l-8 132 H222z" fill="#fff0f0" stroke="#c78484" stroke-width="2"/>
    <text x="250" y="515" text-anchor="middle" class="small">Cloro</text>
    <text x="250" y="536" text-anchor="middle" class="tiny">ossidante</text>
  </g>

  <!-- TUBAZIONE PRINCIPALE -->
  <g id="pipes">
    <path class="pipe" d="M300 470 H365"/>
    <path class="pipe" d="M365 470 V575 H640"/>
    <path class="pipe" d="M695 575 H770"/>
    <path class="pipe" d="M840 575 H920"/>
    <path class="pipe" d="M1010 575 H1095 V430"/>
    <path class="pipe" d="M1095 430 V355 H1020"/>
    <path class="pipe" d="M1020 355 H980"/>
    <path class="pipe" d="M300 470 V385 H370"/>
  </g>

  <!-- VASCA -->
  <g id="pool" class="component" data-component="Vasca piscina">
    <rect class="hit" x="350" y="320" width="650" height="210" rx="8"/>
    <path d="M380 345 H980 V500 H380z" fill="#fbfdff" stroke="#556b7b" stroke-width="3"/>
    <path d="M390 385
             C420 370 450 400 480 385
             C510 370 540 400 570 385
             C600 370 630 400 660 385
             C690 370 720 400 750 385
             C780 370 810 400 840 385
             C870 370 900 400 930 385
             C950 377 965 383 980 388
             V500 H390 Z" fill="#bfe9f6" opacity=".85"/>
    <rect x="630" y="330" width="12" height="95" fill="#8b9aa5"/>
    <rect x="655" y="330" width="12" height="95" fill="#8b9aa5"/>
    <path d="M630 350 H667 M630 370 H667 M630 390 H667" stroke="#8b9aa5" stroke-width="4"/>
    <text x="680" y="455" text-anchor="middle" class="label">VASCA</text>
  </g>

  <!-- SONDE -->
  <g id="probes">
    <g id="probe_ph" class="component" data-component="Sonda pH">
      <rect class="hit" x="770" y="285" width="60" height="180"/>
      <circle cx="800" cy="308" r="18" fill="#1477d4"/>
      <text x="800" y="313" text-anchor="middle" fill="#fff" style="font:700 12px Arial">pH</text>
      <rect x="794" y="326" width="12" height="100" rx="5" fill="#e9eef2" stroke="#556b7b" stroke-width="2"/>
    </g>
    <g id="probe_orp" class="component" data-component="Sonda ORP / Redox">
      <rect class="hit" x="835" y="285" width="60" height="180"/>
      <circle cx="865" cy="308" r="18" fill="#e94b4b"/>
      <text x="865" y="313" text-anchor="middle" fill="#fff" style="font:700 11px Arial">ORP</text>
      <rect x="859" y="326" width="12" height="100" rx="5" fill="#e9eef2" stroke="#556b7b" stroke-width="2"/>
    </g>
    <g id="probe_temp" class="component" data-component="Sonda temperatura">
      <rect class="hit" x="900" y="285" width="60" height="180"/>
      <circle cx="930" cy="308" r="18" fill="#7a4aa8"/>
      <text x="930" y="313" text-anchor="middle" fill="#fff" style="font:700 12px Arial">T°</text>
      <rect x="924" y="326" width="12" height="100" rx="5" fill="#e9eef2" stroke="#556b7b" stroke-width="2"/>
    </g>
  </g>

  <!-- POMPA -->
  <g id="circulation_pump" class="component" data-component="Pompa di ricircolo">
    <rect class="hit" x="630" y="535" width="100" height="90"/>
    <circle cx="675" cy="575" r="27" fill="#fff" stroke="#526778" stroke-width="3"/>
    <path d="M662 558 L693 575 L662 592 Z" fill="#526778"/>
    <text x="675" y="620" text-anchor="middle" class="small">Pompa</text>
  </g>

  <!-- FILTRO -->
  <g id="filter" class="component" data-component="Filtro">
    <rect class="hit" x="755" y="525" width="100" height="115"/>
    <ellipse cx="805" cy="545" rx="32" ry="10" fill="#fff" stroke="#526778" stroke-width="3"/>
    <rect x="773" y="545" width="64" height="58" fill="#fff" stroke="#526778" stroke-width="3"/>
    <ellipse cx="805" cy="603" rx="32" ry="10" fill="#fff" stroke="#526778" stroke-width="3"/>
    <text x="805" y="632" text-anchor="middle" class="small">Filtro</text>
  </g>

  <!-- RISCALDATORE OPTIONAL -->
  <g id="heater" class="component" data-component="Riscaldatore" data-optional="true">
    <rect class="hit" x="900" y="515" width="145" height="135"/>
    <rect x="930" y="535" width="80" height="75" rx="6" fill="#fff" stroke="#526778" stroke-width="3"/>
    <path d="M945 550 H995 M945 565 H995 M945 580 H995 M945 595 H995" stroke="#d36b3c" stroke-width="4"/>
    <text x="970" y="632" text-anchor="middle" class="small">Riscaldatore</text>
  </g>

  <!-- PUNTI DI INIEZIONE -->
  <g id="injection_points">
    <circle cx="335" cy="385" r="7" fill="#1477d4"/>
    <circle cx="355" cy="385" r="7" fill="#e94b4b"/>
    <text x="344" y="365" text-anchor="middle" class="tiny">Iniezione</text>
  </g>


  <!-- CONNETTIVITÀ OPTIONAL: gruppo indipendente, facilmente spostabile/nascondibile in Inkscape -->
  <g id="connectivity" data-component="Connettività">
    <text x="930" y="92" text-anchor="middle" class="label">Connettività</text>

    <!-- collegamento diretto locale -->
    <g id="connectivity_direct" class="component" data-component="Connessione diretta">
      <rect class="hit" x="805" y="105" width="115" height="120" rx="10"/>
      <rect x="830" y="120" width="65" height="42" rx="7" fill="#ffffff" stroke="#526778" stroke-width="2"/>
      <circle cx="862.5" cy="148" r="3.5" fill="#526778"/>
      <path d="M842 181 Q862 164 883 181" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round"/>
      <path d="M849 190 Q862 179 876 190" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round"/>
      <circle cx="862.5" cy="197" r="3.5" fill="#526778"/>
      <text x="862" y="216" text-anchor="middle" class="tiny">Diretta</text>
    </g>

    <!-- router / internet -->
    <g id="connectivity_router" class="component" data-component="Router / Internet">
      <rect class="hit" x="920" y="105" width="120" height="120" rx="10"/>
      <rect x="945" y="154" width="70" height="35" rx="6" fill="#ffffff" stroke="#526778" stroke-width="2"/>
      <line x1="958" y1="154" x2="952" y2="128" stroke="#526778" stroke-width="3" stroke-linecap="round"/>
      <line x1="1002" y1="154" x2="1008" y2="128" stroke="#526778" stroke-width="3" stroke-linecap="round"/>
      <path d="M960 141 Q980 124 1000 141" fill="none" stroke="#526778" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="980" cy="177" r="3" fill="#157bb8"/>
      <text x="980" y="216" text-anchor="middle" class="tiny">Router</text>
    </g>

    <!-- telefono vicino -->
    <g id="phone_local" class="component" data-component="Telefono vicino">
      <rect class="hit" x="1040" y="105" width="70" height="120" rx="10"/>
      <rect x="1055" y="122" width="40" height="72" rx="7" fill="#ffffff" stroke="#526778" stroke-width="2"/>
      <rect x="1060" y="130" width="30" height="51" rx="2" fill="#eef4f8"/>
      <circle cx="1075" cy="187" r="2.5" fill="#526778"/>
      <text x="1075" y="216" text-anchor="middle" class="tiny">Vicino</text>
    </g>

    <!-- telefono remoto -->
    <g id="phone_remote" class="component" data-component="Telefono remoto">
      <rect class="hit" x="1110" y="105" width="75" height="120" rx="10"/>
      <rect x="1127" y="122" width="40" height="72" rx="7" fill="#ffffff" stroke="#526778" stroke-width="2"/>
      <rect x="1132" y="130" width="30" height="51" rx="2" fill="#eef4f8"/>
      <circle cx="1147" cy="187" r="2.5" fill="#526778"/>
      <path d="M1121 143 C1107 137 1107 119 1121 114" fill="none" stroke="#59798f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M1173 143 C1187 137 1187 119 1173 114" fill="none" stroke="#59798f" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1147" y="216" text-anchor="middle" class="tiny">Remoto</text>
    </g>

    <!-- linee logiche di connettività; volutamente separate dall'impianto idraulico -->
    <path id="link_direct" d="M750 158 H830" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="6 5"/>
    <path id="link_router" d="M750 175 H945" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="6 5"/>
    <path id="link_router_local_phone" d="M1015 171 H1055" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="6 5"/>
    <path id="link_router_remote_phone" d="M1015 180 C1060 235 1115 235 1147 194" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="6 5"/>
  </g>


  <!-- PANNELLO INFO INTERNO -->
  <g id="info_panel">
    <rect x="360" y="642" width="480" height="48" rx="8" fill="#f5f7f9" stroke="#c8d2da"/>
    <text id="info_text" x="600" y="672" text-anchor="middle" class="small">Clicca un componente per selezionarlo</text>
  </g>

  <script><![CDATA[
    (function(){
      const svg = document.documentElement;
      const info = svg.getElementById('info_text');
      svg.querySelectorAll('.component').forEach(function(el){
        el.addEventListener('click', function(evt){
          evt.stopPropagation();
          svg.querySelectorAll('.component').forEach(function(x){ x.classList.remove('is-selected'); });
          el.classList.add('is-selected');
          const name = el.getAttribute('data-component') || el.id;
          if(info) info.textContent = 'Selezionato: ' + name + '  |  id="' + el.id + '"';
          svg.dispatchEvent(new CustomEvent('configurator:select', {
            bubbles: true,
            detail: { id: el.id, component: name }
          }));
        });
      });
      svg.addEventListener('click', function(evt){
        if(evt.target === svg){
          svg.querySelectorAll('.component').forEach(function(x){ x.classList.remove('is-selected'); });
          if(info) info.textContent = 'Clicca un componente per selezionarlo';
        }
      });
    })();
  ]]></script>
</svg>
