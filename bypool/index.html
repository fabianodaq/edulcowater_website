<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edulco Water | Applications</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logoedulcowater.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base-path=".." data-page="bypool">
    <header class="main-header">
        <div class="container"><nav class="main-nav">
            <div class="brand" aria-label="Edulco Water"><img src="../assets/logoedulcowater.svg" alt=""><span>EdulcoWater</span></div>
            <div class="header-actions"><a class="icon-button cart-button" href="../cart/index.html" aria-label="Cart" title="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 11h10l2-8H6"></path><circle cx="9" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg><span class="cart-count">0</span></a></div>
        </nav></div>
        <nav class="menu-panel" id="site-menu" aria-label="Main navigation"><div class="container" data-menu-panel></div></nav>
    </header>
    <main class="default-page container">
        <p class="section-label">BUILD YOUR POOL WITH EDULCOWATER</p>
        <p class="bypool-subtitle">Build your pool plant industrial, premium, modular or smart</p>
        <section class="bypool-section" aria-label="Industrial Pool System">
            <div class="bypool-svg-full">
            <object data="../assets/bypool/bypool_industrial.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€10.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-industrial" data-name="Industrial Pool System" data-price="10000">Add</button>
            </div>
        </section>

        <section class="bypool-section" aria-label="Premium Pool System">
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_premium.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€10.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-premium" data-name="Premium Pool System" data-price="10000">Add</button>
            </div>
        </section>

        <section class="bypool-section" aria-label="Modular Pool System">
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_modular.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€10.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-modular" data-name="Modular Pool System" data-price="10000">Add</button>
            </div>
        </section>

        <section class="bypool-section" aria-label="Smart Pool System">
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_smart.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€10.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-smart" data-name="Smart Pool System" data-price="10000">Add</button>
            </div>
        </section>
    </main>
    <script src="../js/common.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        document.querySelectorAll('.add-button-full').forEach((addButton) => {
            addButton.addEventListener('click', function() {
            const cartItem = {
                id: this.dataset.product,
                name: this.dataset.name,
                price: Number(this.dataset.price),
                quantity: 1
            };
            
            // Get or create cart from localStorage
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Check if item already exists
            const existingItem = cart.find(item => item.id === cartItem.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push(cartItem);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update cart count
            const cartCount = document.querySelector('.cart-count');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
            
            // Show feedback
            alert(`Added to cart! Price: EUR ${cartItem.price.toLocaleString('it-IT')}`);
        });
        });
    </script>
</body>
</html>
