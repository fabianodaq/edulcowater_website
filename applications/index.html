<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edulco Water | Applications</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logoedulcowater.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base-path=".." data-page="applications">
    <header class="main-header">
        <div class="container"><nav class="main-nav">
            <div class="brand" aria-label="Edulco Water"><img src="../assets/logoedulcowater.svg" alt=""><span>EdulcoWater</span></div>
            <div class="header-actions"><a class="icon-button cart-button" href="../cart/index.html" aria-label="Cart" title="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 11h10l2-8H6"></path><circle cx="9" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg><span class="cart-count">0</span></a></div>
        </nav></div>
        <nav class="menu-panel" id="site-menu" aria-label="Main navigation"><div class="container" data-menu-panel></div></nav>
    </header>
    <main class="default-page container">
        <p class="section-label">BUILD YOUR POOL WITH EDULCOWATER</p>
        <p class="bypool-subtitle">Build your pool plant centralized, distributed or smart</p>
        <section class="bypool-section" aria-label="Centralized Pool System">
            <h2 class="bypool-title">Centralized System</h2>
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_centrilized.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€10.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-centralized">Add</button>
            </div>
        </section>

        <section class="bypool-section" aria-label="Distributed Pool System">
            <h2 class="bypool-title">Distributed System</h2>
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_distributed.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€8.500</span>
                </div>
                <button class="add-button-full" data-product="bypool-distributed">Add</button>
            </div>
        </section>

        <section class="bypool-section" aria-label="Smart Pool System">
            <h2 class="bypool-title">Fully Smart System</h2>
            <div class="bypool-svg-full">
                <object data="../assets/bypool/bypool_smart.svg" type="image/svg+xml" class="bypool-svg"></object>
            </div>
            <div class="bypool-bottom-section">
                <div class="bypool-text-panel">
                    <!-- Empty text panel for now -->
                </div>
            </div>
            <div class="bypool-actions">
                <div class="price-display-full">
                    <span class="price-amount">€15.000</span>
                </div>
                <button class="add-button-full" data-product="bypool-smart">Add</button>
            </div>
    </main>
    <script src="../js/common.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        // Add to cart button
        const addButton = document.querySelector('.add-button-full');
        
        addButton.addEventListener('click', function() {
            // Add to cart logic
            const cartItem = {
                id: 'bypool-centralized',
                name: 'Centralized Pool System',
                price: 2500,
                quantity: 1
            };
            
            // Get or create cart from localStorage
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Check if item already exists
            const existingItem = cart.find(item => item.id === cartItem.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push(cartItem);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update cart count
            const cartCount = document.querySelector('.cart-count');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
            
            // Show feedback
            alert('Added to cart! Price: $2,500');
        });
    </script>
</body>
</html>
